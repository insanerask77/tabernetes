# Tabernetes (the in-browser Kubernetes control plane) plus a local Docker
# Hub mirror for the pods that run in browser tabs.
#
#   docker compose up -d --force-recreate --remove-orphans
#
# In Nginx Proxy Manager add ONE proxy host with an SSL certificate:
#   tabernetes.madolell.com  ->  http://<server IP>:8977
#
# The page and the registry share that domain: the nginx inside the
# tabernetes container sends /v2/ to the registry on port 5000. Same domain
# means no CORS, so no extra nginx is needed.
#
# The images are public on ghcr.io (the CI of insanerask77/tabernetes builds
# them on every release). Watchtower pulls a new site image within five
# minutes of a release and recreates the container, so a release deploys
# itself.

services:
  tabernetes:
    image: ghcr.io/insanerask77/tabernetes-site:latest
    container_name: tabernetes
    restart: unless-stopped
    labels:
      # Only containers with this label are updated by Watchtower.
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      # Where the browser pulls images from: this same site (/v2/ goes to the
      # registry). It is written into index.html on the first start, so after
      # a change run "docker compose up -d --force-recreate".
      REGISTRY: https://tabernetes.madolell.com
      # The node image in the "docker run" that join prints. Empty: the one
      # built into the page, ghcr.io/insanerask77/tabernetes with the version
      # of the release. Change it and recreate, no rebuild.
      NODE_IMAGE: ""
    ports:
      - "8977:80"
    depends_on:
      - registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Local pull-through cache of Docker Hub on port 5000 (only inside the
  # compose network). The first pull of an image goes to Docker Hub, later
  # pulls come from the copy on this server.
  registry:
    image: registry:2
    container_name: tabernetes-registry
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      # Optional: a Docker Hub account raises the pull rate limit (anonymous
      # pulls are limited per IP). Remove the "#" and fill in your user and
      # an access token from hub.docker.com.
      # REGISTRY_PROXY_USERNAME: your-docker-hub-user
      # REGISTRY_PROXY_PASSWORD: your-docker-hub-access-token
    volumes:
      # Keep the cached images when the container is recreated.
      - registry-data:/var/lib/registry

  # Updates the tabernetes container when a new image is on ghcr.io. It
  # touches only containers with the label above, not the rest of the server.
  # The fork of nicholas-fedor, because containrrr/watchtower is archived and
  # its Docker client is too old for Docker 29.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: tabernetes-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      # Delete the old image after an update.
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  registry-data:
