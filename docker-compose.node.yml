# Docker Compose for a Tabernetes NODE (kubelet, containerd and the agent).
#
# It is the image that `join` prints in the terminal of the browser, started
# with compose instead of `docker run`. The node does not last: it lives as
# long as its WebRTC connection to the cluster in the browser.
#
# Usage:
#   1. In the Tabernetes terminal (browser), run:  join
#      It prints a `docker run ...` with a PORT and a TOKEN.
#   2. Copy the port and the token and start the node here:
#
#        NODE_PORT=50001 TOKEN="<token>" \
#          docker compose -f docker-compose.node.yml run --rm node
#
#   3. The node prints an "accept ..." line. Paste it into the terminal of
#      the browser.
#
# For a node on another machine of the LAN, add --advertise before the token:
#   command: ["--advertise", "${ADVERTISE_IP}", "${TOKEN}"]
#
# The image is on ghcr.io (the CI of insanerask77/tabernetes builds it). Use
# the version of the page (`join` prints it) instead of latest when they
# differ. The package is public, so no login is needed.

services:
  node:
    image: ghcr.io/insanerask77/tabernetes:latest
    pull_policy: always
    stdin_open: true
    tty: true
    mem_limit: 2g
    pids_limit: 4096
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
      # apparmor=unconfined   # only Linux hosts with AppArmor (not macOS)
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # The port comes from `join` (50000 + the node number). It listens on
      # localhost only, like the command that the browser prints.
      - "127.0.0.1:${NODE_PORT:-50001}:${NODE_PORT:-50001}/udp"
    command: ["${TOKEN}"]
    volumes:
      # The state of containerd (pulled images), kept between joins.
      - containerd-data:/var/lib/containerd

volumes:
  containerd-data:
