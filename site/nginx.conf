# Static site for the Tabernetes web app (the in-browser Kubernetes control
# plane). No gzip on purpose: tabernetes.wasm.zst is already zstd-compressed
# and the page unpacks it with fzstd. Re-compressing it would waste CPU and
# break the progress byte counts (data-size matches the raw .zst bytes).

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the types the page needs. Extensionless VM files (vm/vmlinux,
    # vm/init) fall back to default_type below.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js mjs;
        application/wasm          wasm;
        application/octet-stream  zst bin;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }

    # Small and changes with every build (the data-size attribute).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The .zst binary is fetched, unpacked in a worker and compiled while it
    # arrives. Serve it raw (no Content-Encoding), so the page's own fzstd
    # decompression applies and data-size matches the bytes actually sent.
    location ~ \.zst$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type application/octet-stream;
    }

    # The Docker Hub mirror (registry:2, service "registry" in
    # docker-compose.yml) under the same origin as the page. Same origin
    # means the browser needs no CORS headers. The upstream is a variable, so
    # nginx resolves it per request and still starts without a registry
    # (then /v2/ answers 502). 127.0.0.11 is Docker's internal DNS.
    location /v2/ {
        resolver 127.0.0.11 valid=30s;
        set $registry http://registry:5000;
        proxy_pass $registry;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # The first pull of a layer waits for Docker Hub.
        proxy_read_timeout 300s;
    }

    # The service worker of the "proxy <port>" command, served under its scope
    # /tabernetes-proxy/ (web/src/proxy.js). Kept fresh so an update applies.
    location = /tabernetes-proxy/sw.js {
        add_header Cache-Control "no-cache";
    }
}
